services:
  # ── Backend Service ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alumni_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://alumni_user:alumni_pass@db:5432/alumni_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - alumni_network

  # ── Database Service (PostgreSQL 16) ─────────────────────
  db:
    image: postgres:16-alpine
    container_name: alumni_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: alumni_user
      POSTGRES_PASSWORD: alumni_pass
      POSTGRES_DB: alumni_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumni_user -d alumni_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - alumni_network

# ── Networks ──────────────────────────────────────────────
networks:
  alumni_network:
    name: alumni_network
    driver: bridge

# ── Volumes ───────────────────────────────────────────────
volumes:
  postgres_data:
